<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港健康生活產業大奬 - 學生專題研習工作台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        .tab-btn.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: bold; }
        [contenteditable=true]:empty:before { content: attr(placeholder); color: #9ca3af; cursor: text; }
        [contenteditable=true] img { max-width: 100%; max-height: 300px; display: block; margin-top: 10px; border-radius: 4px; }
        /* PPT 預覽樣式 */
        .slide-card { background-color: #ffffff; background-image: radial-gradient(#f9fafb 1px, transparent 1px); background-size: 20px 20px; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-gray-800 p-6">
    <div class="max-w-5xl mx-auto bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- 頂部導航 -->
        <div class="flex border-b bg-gray-50">
            <button onclick="switchTab('member')" id="tab-member" class="tab-btn active flex-1 py-4 text-center text-gray-600 hover:bg-gray-100 transition">
                <span class="text-lg">🧑‍🎓 組員填寫區 (個人論點)</span>
            </button>
            <button onclick="switchTab('leader')" id="tab-leader" class="tab-btn flex-1 py-4 text-center text-gray-600 hover:bg-gray-100 transition">
                <span class="text-lg">👑 組長統整區 (合併與預覽)</span>
            </button>
        </div>

        <!-- ==================== 組員填寫區 ==================== -->
        <div id="section-member" class="p-8">
            <h2 class="text-2xl font-bold mb-2 text-gray-800">撰寫個人分論點</h2>
            <p class="text-gray-500 mb-6 pb-4 border-b">每位組員負責一個分論點。完成後點擊最下方按鈕匯出檔案，並傳送給組長。</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block font-semibold mb-1">你的姓名/學號：</label>
                    <input type="text" id="studentName" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-400 outline-none" placeholder="例如：陳大文 (12345678)">
                </div>
                <div>
                    <label class="block font-semibold mb-1">健康產品或服務名稱：</label>
                    <input type="text" id="productName" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-400 outline-none" placeholder="全組統一的產品名稱">
                </div>
            </div>

            <div class="bg-blue-50 p-5 rounded-lg border border-blue-100 mb-6">
                <h3 class="font-bold text-blue-800 mb-3 text-lg">我的論點設計</h3>
                <div class="mb-4">
                    <label class="block font-semibold mb-1">負責的評審準則 (論證方向)：</label>
                    <select id="criterion" class="w-full border border-gray-300 p-2 rounded outline-none">
                        <option>市場表現</option>
                        <option>社會價值</option>
                        <option>功能/功效（與健康相關）</option>
                        <option>創新</option>
                        <option>可持續發展</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold mb-1">分論點：</label>
                    <input type="text" id="subArgument" class="w-full border border-gray-300 p-2 rounded focus:ring-2 focus:ring-blue-400 outline-none" placeholder="將準則轉化為具體論點，例如：該產品功能卓越，能有效改善...">
                </div>
            </div>

            <div id="evidence-container">
                <h3 class="font-bold text-gray-800 mb-3 text-lg">搜集論據與證明邏輯</h3>
                <p class="text-sm text-gray-600 mb-4">請提供事實論據，並解釋該論據「如何證明」你的分論點。</p>
                
                <div class="evidence-block bg-white p-5 rounded-lg shadow-sm border border-gray-200 mb-4">
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="font-bold text-gray-700 text-lg">論據 <span class="ev-index">1</span></h4>
                        <button onclick="removeEvidence(this)" class="text-red-500 text-sm hover:underline hidden">刪除</button>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-1">搜集資料的方法：</label>
                        <select class="ev-method w-full border border-gray-300 p-2 rounded outline-none bg-gray-50">
                            <option>問卷調查 (一手資料)</option>
                            <option>專家/用家訪問 (一手資料)</option>
                            <option>親身體驗 (一手資料)</option>
                            <option>觀察分析 (一手+二手資料)</option>
                            <option>機構測試結果 (二手資料)</option>
                            <option>網上資料/報導 (二手資料)</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold mb-1">論據具體內容與證明邏輯：</label>
                        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-2 mb-2 text-sm text-yellow-800">
                            <strong>💡 填寫指引：</strong> 請具體列出數據或事實，並清晰解釋<strong>「這論據怎麼樣能證明你的論點？」</strong>
                        </div>
                        <textarea class="ev-logic w-full border border-gray-300 p-3 rounded h-28 focus:ring-2 focus:ring-blue-400 outline-none" placeholder="1. 論據內容：(例如：問卷顯示93%用家滿意...)\n2. 證明邏輯：(這反映了產品在...方面表現卓越，因為...)"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">論據圖片/截圖 (選填，可直接 Ctrl+V 貼上圖片)：</label>
                        <div class="ev-image-paste w-full border-2 border-dashed border-gray-300 p-4 text-center rounded min-h-[100px] outline-none overflow-hidden" contenteditable="true" placeholder="點擊此處並按 Ctrl+V 貼上圖片..." onpaste="handleImagePaste(event)"></div>
                    </div>
                </div>
            </div>

            <button onclick="addEvidence()" class="w-full py-3 border-2 border-dashed border-blue-400 text-blue-600 font-bold rounded-lg hover:bg-blue-50 transition mb-8">
                + 新增一項論據
            </button>

            <div class="text-center pt-6 border-t">
                <button onclick="exportMemberData()" class="bg-blue-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-blue-700 text-lg shadow-md transition">
                    ⬇️ 下載個人論點檔案 (.json)
                </button>
            </div>
        </div>

        <!-- ==================== 組長統整區 ==================== -->
        <div id="section-leader" class="p-8 hidden">
            <h2 class="text-2xl font-bold mb-2 text-gray-800">組長統整與合併報告</h2>
            <p class="text-gray-500 mb-6 pb-4 border-b">請設定全組「中心論點」，並上傳組員的 `.json` 檔案進行合併與 PPT 預覽。</p>

            <div class="bg-green-50 p-5 rounded-lg border border-green-200 mb-6">
                <label class="block font-bold text-green-900 mb-2">全組中心論點 (Center Argument)：</label>
                <input type="text" id="centerArgument" oninput="updatePPTPreview()" class="w-full border border-green-300 p-3 rounded focus:ring-2 focus:ring-green-400 outline-none" placeholder="例如：本公司的產品以人為本，功能卓越且具社會價值，值得獲取大奬。">
            </div>

            <div class="mb-8">
                <label class="block font-bold mb-2 text-gray-700">上傳組員檔案 (可一次選取多個，或分多次上傳)：</label>
                <div id="dropZoneLeader" class="border-2 border-dashed border-blue-400 rounded-lg p-8 text-center bg-blue-50 hover:bg-blue-100 transition cursor-pointer" onclick="document.getElementById('fileUploader').click()">
                    <span class="text-4xl mb-2 block">📁</span>
                    <p class="text-blue-800 font-bold text-lg">點擊選擇組員檔案，或將 JSON 檔案拖曳至此</p>
                    <p class="text-sm text-blue-600 mt-1">上傳後將自動合併並在下方顯示 PPT 預覽</p>
                    <input type="file" id="fileUploader" multiple accept=".json" class="hidden" onchange="handleFilesUpload(event)">
                </div>
                <div class="mt-3 flex justify-between items-center">
                    <span id="uploadStatus" class="text-sm font-bold text-green-600"></span>
                    <button onclick="clearLeaderData()" class="text-sm text-red-500 hover:underline border border-red-200 px-3 py-1 rounded bg-red-50">🗑️ 清空所有已上傳檔案</button>
                </div>
            </div>

            <!-- PPT 預覽區 -->
            <div id="ppt-preview-section" class="hidden mb-8 bg-gray-800 p-6 rounded-xl shadow-inner">
                <h3 class="font-bold text-xl mb-4 text-white flex justify-between items-center border-b border-gray-600 pb-3">
                    <span>📺 簡報合併預覽 (16:9)</span>
                    <span class="text-sm bg-gray-700 px-3 py-1 rounded text-gray-300 font-normal">向下捲動查看各組員頁面</span>
                </h3>
                <div id="pptPreviewContainer" class="space-y-8 overflow-y-auto max-h-[800px] custom-scroll pr-4 pb-4">
                    <!-- PPT 內容將在這裡生成 -->
                </div>
            </div>

            <div class="text-center pt-6 border-t border-gray-200">
                <button onclick="exportFinalReport()" id="btn-export-final" class="bg-green-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-green-700 text-lg shadow-md transition opacity-50 cursor-not-allowed" disabled>
                    ✅ 匯出全組最終報告 JSON (供老師平台批改)
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        let consolidatedData = [];

        // 頁籤切換
        function switchTab(tabId) {
            document.getElementById('section-member').classList.add('hidden');
            document.getElementById('section-leader').classList.add('hidden');
            document.getElementById('tab-member').classList.remove('active');
            document.getElementById('tab-leader').classList.remove('active');
            document.getElementById('section-' + tabId).classList.remove('hidden');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // --- 組員邏輯 ---
        function addEvidence() {
            const container = document.getElementById('evidence-container');
            const blocks = container.querySelectorAll('.evidence-block');
            const newIndex = blocks.length + 1;
            const newDiv = document.createElement('div');
            newDiv.className = 'evidence-block bg-white p-5 rounded-lg shadow-sm border border-gray-200 mb-4';
            newDiv.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-bold text-gray-700 text-lg">論據 <span class="ev-index">${newIndex}</span></h4>
                    <button onclick="removeEvidence(this)" class="text-red-500 text-sm hover:underline">刪除</button>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1">搜集資料的方法：</label>
                    <select class="ev-method w-full border border-gray-300 p-2 rounded outline-none bg-gray-50">
                        <option>問卷調查 (一手資料)</option><option>專家/用家訪問 (一手資料)</option>
                        <option>親身體驗 (一手資料)</option><option>觀察分析 (一手+二手資料)</option>
                        <option>機構測試結果 (二手資料)</option><option>網上資料/報導 (二手資料)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-semibold mb-1">論據具體內容與證明邏輯：</label>
                    <div class="bg-yellow-50 border-l-4 border-yellow-400 p-2 mb-2 text-sm text-yellow-800">
                        <strong>💡 填寫指引：</strong> 請具體列出數據或事實，並清晰解釋<strong>「這論據怎麼樣能證明你的論點？」</strong>
                    </div>
                    <textarea class="ev-logic w-full border border-gray-300 p-3 rounded h-28 focus:ring-2 focus:ring-blue-400 outline-none" placeholder="1. 論據內容：...\\n2. 證明邏輯：..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">論據圖片/截圖 (選填，可直接 Ctrl+V 貼上)：</label>
                    <div class="ev-image-paste w-full border-2 border-dashed border-gray-300 p-4 text-center rounded min-h-[100px] outline-none overflow-hidden" contenteditable="true" placeholder="點擊此處並按 Ctrl+V 貼上圖片..." onpaste="handleImagePaste(event)"></div>
                </div>
            `;
            container.appendChild(newDiv);
            updateDeleteButtons();
        }

        function removeEvidence(btn) {
            btn.closest('.evidence-block').remove();
            const blocks = document.querySelectorAll('.evidence-block');
            blocks.forEach((block, idx) => { block.querySelector('.ev-index').innerText = idx + 1; });
            updateDeleteButtons();
        }

        function updateDeleteButtons() {
            const blocks = document.querySelectorAll('.evidence-block');
            blocks.forEach(block => {
                const delBtn = block.querySelector('button');
                if(blocks.length === 1) delBtn.classList.add('hidden');
                else delBtn.classList.remove('hidden');
            });
        }

        function handleImagePaste(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file') {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const img = document.createElement('img');
                        img.src = event.target.result;
                        e.target.appendChild(img);
                    };
                    reader.readAsDataURL(blob);
                    e.preventDefault(); 
                }
            }
        }

        // 使用 Blob 穩定下載大型包含圖片的 JSON
        function downloadJSONFile(data, filename) {
            const jsonString = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportMemberData() {
            const studentName = document.getElementById('studentName').value.trim();
            const subArgument = document.getElementById('subArgument').value.trim();
            
            if(!studentName || !subArgument) { alert("請填寫姓名及分論點！"); return; }

            const data = {
                type: "member_argument",
                studentName: studentName,
                productName: document.getElementById('productName').value.trim(),
                criterion: document.getElementById('criterion').value,
                subArgument: subArgument,
                evidences: []
            };

            document.querySelectorAll('.evidence-block').forEach(block => {
                let imgData = "";
                const imgElement = block.querySelector('.ev-image-paste img');
                if (imgElement) imgData = imgElement.src;
                data.evidences.push({
                    method: block.querySelector('.ev-method').value,
                    logic: block.querySelector('.ev-logic').value.trim(),
                    image: imgData
                });
            });

            downloadJSONFile(data, `分論點_${studentName}.json`);
        }

        // --- 組長邏輯 ---
        function clearLeaderData() {
            consolidatedData = [];
            document.getElementById('fileUploader').value = '';
            document.getElementById('uploadStatus').innerText = '';
            updatePPTPreview();
            document.getElementById('btn-export-final').disabled = true;
            document.getElementById('btn-export-final').classList.add('opacity-50', 'cursor-not-allowed');
            alert("已清空所有上傳紀錄！");
        }

        // 將 FileReader 包裝成 Promise 以確保循序執行，解決預覽失敗問題
        function readFileAsync(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        async function handleFilesUpload(e) {
            let files;
            if (e.type === 'drop') {
                e.preventDefault();
                files = e.dataTransfer.files;
            } else {
                files = e.target.files;
            }
            
            if(!files || files.length === 0) return;

            let hasNewData = false;
            let statusText = [];

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                try {
                    const text = await readFileAsync(file);
                    const json = JSON.parse(text);
                    
                    // 驗證是否為我們產生的格式
                    if(json.type === "member_argument" || (json.subArgument && Array.isArray(json.evidences))) {
                        const existingIdx = consolidatedData.findIndex(d => d.studentName === json.studentName);
                        if(existingIdx > -1) {
                            consolidatedData[existingIdx] = json; // 覆寫更新
                            statusText.push(`更新了 ${json.studentName} 的資料`);
                        } else {
                            consolidatedData.push(json); // 新增
                            statusText.push(`載入了 ${json.studentName} 的資料`);
                        }
                        hasNewData = true;
                    } else {
                        alert(`檔案 ${file.name} 格式不符！請確保上傳的是組員個人的分論點檔案。`);
                    }
                } catch (err) {
                    console.error("解析失敗", err);
                    alert(`檔案 ${file.name} 無法解析，可能不是正確的 JSON。`);
                }
            }
            
            if (hasNewData) {
                document.getElementById('uploadStatus').innerText = `✔️ 目前已成功合併 ${consolidatedData.length} 位組員的報告！`;
                updatePPTPreview();
                document.getElementById('btn-export-final').disabled = false;
                document.getElementById('btn-export-final').classList.remove('opacity-50', 'cursor-not-allowed');
            }
            
            // 重置 file input
            if (e.target && e.target.value) e.target.value = '';
        }

        // 綁定拖曳事件
        window.addEventListener('DOMContentLoaded', () => {
            const dropZone = document.getElementById('dropZoneLeader');
            if(dropZone) {
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, preventDefaults, false);
                });
                function preventDefaults(e) { e.preventDefault(); e.stopPropagation(); }
                
                ['dragenter', 'dragover'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => dropZone.classList.add('bg-blue-100', 'border-blue-500'));
                });
                ['dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => dropZone.classList.remove('bg-blue-100', 'border-blue-500'));
                });
                dropZone.addEventListener('drop', handleFilesUpload, false);
            }
        });

        function updatePPTPreview() {
            const container = document.getElementById('pptPreviewContainer');
            const centerArg = document.getElementById('centerArgument').value.trim();
            const section = document.getElementById('ppt-preview-section');
            
            if(consolidatedData.length === 0) {
                container.innerHTML = '';
                section.classList.add('hidden');
                return;
            }

            // 抓取產品名稱及組員名單
            let prodName = "健康產品/服務專題報告";
            for (let i = 0; i < consolidatedData.length; i++) {
                if (consolidatedData[i].productName) {
                    prodName = consolidatedData[i].productName;
                    break;
                }
            }
            
            let memberNames = [];
            for (let i = 0; i < consolidatedData.length; i++) {
                if (consolidatedData[i].studentName) memberNames.push(consolidatedData[i].studentName);
            }
            let memberNamesStr = memberNames.join("、");

            // 生成 PPT 首頁
            let slidesHTML = `
                <div class="slide-card aspect-video flex flex-col justify-center items-center p-12 text-center rounded-xl relative overflow-hidden shadow-md">
                    <div class="absolute top-0 left-0 w-full h-4 bg-gradient-to-r from-blue-500 to-green-400"></div>
                    <h2 class="text-4xl md:text-5xl font-extrabold text-blue-900 mb-6 drop-shadow-sm">${prodName}</h2>
                    <h3 class="text-2xl font-bold text-gray-800 mb-10 w-4/5 mx-auto bg-white border-2 border-gray-100 p-6 rounded-lg shadow-lg">
                        中心論點：<span class="text-blue-700">${centerArg || '<span class="text-gray-400 font-normal">請於上方輸入全組中心論點</span>'}</span>
                    </h3>
                    <div class="text-xl text-gray-600 font-semibold mt-auto bg-gray-100 px-6 py-2 rounded-full border border-gray-200">
                        👨‍🎓 小組成員：${memberNamesStr}
                    </div>
                </div>
            `;

            // 生成每一位成員的分論點頁面
            for (let index = 0; index < consolidatedData.length; index++) {
                let memberData = consolidatedData[index];
                
                slidesHTML += `
                    <div class="slide-card aspect-video flex flex-col p-8 rounded-xl relative overflow-hidden shadow-md mt-8">
                        <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
                        
                        <div class="flex justify-between items-end border-b-2 border-gray-300 pb-3 mb-6">
                            <h3 class="text-3xl font-bold text-gray-800 w-3/4 leading-tight">
                                <span class="text-blue-600 mr-2">論點 ${index + 1}:</span>${memberData.subArgument}
                            </h3>
                            <div class="text-right">
                                <div class="text-sm text-gray-500 font-bold mb-1">${memberData.criterion}</div>
                                <div class="text-md bg-blue-100 text-blue-800 px-4 py-1 rounded-full font-semibold shadow-sm">負責人: ${memberData.studentName}</div>
                            </div>
                        </div>
                        
                        <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto custom-scroll pr-2">
                `;

                for (let evIdx = 0; evIdx < memberData.evidences.length; evIdx++) {
                    let ev = memberData.evidences[evIdx];
                    let imgHtml = ev.image ? `<img src="${ev.image}" class="mt-4 max-h-48 object-contain mx-auto border rounded shadow-md">` : '';
                    
                    slidesHTML += `
                        <div class="bg-gray-50 border border-gray-200 rounded-lg p-5 flex flex-col hover:shadow-md transition">
                            <div class="flex items-center justify-between mb-3 border-b pb-2">
                                <h4 class="font-bold text-blue-800 text-lg">論據 ${evIdx + 1}</h4>
                                <span class="text-xs bg-gray-200 text-gray-700 px-3 py-1 rounded-full font-bold">${ev.method}</span>
                            </div>
                            <div class="text-[15px] text-gray-700 whitespace-pre-wrap flex-1 leading-relaxed">${ev.logic}</div>
                            ${imgHtml}
                        </div>
                    `;
                }

                slidesHTML += `</div></div>`;
            }

            container.innerHTML = slidesHTML;
            section.classList.remove('hidden');
        }

        function exportFinalReport() {
            const centerArgument = document.getElementById('centerArgument').value.trim();
            if(!centerArgument) { alert("請填寫全組中心論點！"); return; }
            if(consolidatedData.length === 0) { alert("尚未成功載入任何組員檔案！"); return; }

            let finalProdName = "未命名報告";
            for (let i = 0; i < consolidatedData.length; i++) {
                if (consolidatedData[i].productName) {
                    finalProdName = consolidatedData[i].productName;
                    break;
                }
            }

            const finalData = {
                type: "final_group_report",
                centerArgument: centerArgument,
                productName: finalProdName,
                membersArguments: consolidatedData
            };

            downloadJSONFile(finalData, `最終小組報告統整_${finalProdName}.json`);
        }
    </script>
</body>
</html>
